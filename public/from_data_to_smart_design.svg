<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Explicit Pure White Background Rectangle -->
  <rect width="1200" height="650" fill="#ffffff" />

  <!-- Title -->
  <text x="600" y="65" text-anchor="middle" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    From data to smart design
  </text>
  <text x="600" y="100" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">
    AI-Based Smart Logistics &amp; Accessibility Intelligence Platform
  </text>

  <!-- ================= TOP ROW: 4 CORE DATA INPUTS ================= -->
  
  <!-- 1. Weather Data -->
  <g transform="translate(100, 150)">
    <!-- Cloud & Rain Icon -->
    <g transform="translate(50, 10)">
      <path d="M20 45 a18 18 0 0 1 3 -35 a22 22 0 0 1 40 -4 a18 18 0 0 1 12 39 z" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
      <line x1="30" y1="52" x2="25" y2="66" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
      <line x1="45" y1="52" x2="40" y2="66" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="52" x2="55" y2="66" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="90" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Weather &amp; Rain Data</text>
    <text x="90" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#0284c7">(Open-Meteo &amp; IMD Radar)</text>
  </g>

  <!-- Plus 1 -->
  <text x="345" y="215" text-anchor="middle" font-size="32" font-weight="800" fill="#334155">+</text>

  <!-- 2. GIS & Terrain Slope Data -->
  <g transform="translate(370, 150)">
    <!-- Map & Mountain Pin Icon -->
    <g transform="translate(50, 10)">
      <path d="M10 20 L30 10 L50 20 L70 10 L70 55 L50 65 L30 55 L10 65 Z" fill="#ecfdf5" stroke="#059669" stroke-width="3" stroke-linejoin="round"/>
      <path d="M30 10 L30 55 M50 20 L50 65" stroke="#059669" stroke-width="2"/>
      <!-- Pin -->
      <path d="M40 18 C33 18 28 23 28 30 C28 39 40 48 40 48 C40 48 52 39 52 30 C52 23 47 18 40 18 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="40" cy="28" r="3.5" fill="#ffffff"/>
    </g>
    <text x="90" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ISRO 30m DEM Slope</text>
    <text x="90" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#059669">(Bhuvan CartoDEM)</text>
  </g>

  <!-- Plus 2 -->
  <text x="615" y="215" text-anchor="middle" font-size="32" font-weight="800" fill="#334155">+</text>

  <!-- 3. Soil Pore Saturation -->
  <g transform="translate(640, 150)">
    <!-- Soil & Moisture Icon -->
    <g transform="translate(50, 10)">
      <rect x="15" y="32" width="50" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <line x1="15" y1="44" x2="65" y2="44" stroke="#d97706" stroke-width="2" stroke-dasharray="3 3"/>
      <!-- Water Droplet -->
      <path d="M40 8 C40 8 28 22 28 28 C28 34 33 39 40 39 C47 39 52 34 52 28 C52 22 40 8 40 8 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    </g>
    <text x="90" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Soil Pore Saturation</text>
    <text x="90" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#d97706">(NASA SMAP / MOSDAC)</text>
  </g>

  <!-- Plus 3 -->
  <text x="885" y="215" text-anchor="middle" font-size="32" font-weight="800" fill="#334155">+</text>

  <!-- 4. GSI Landslide Records -->
  <g transform="translate(910, 150)">
    <!-- Mountain Hazard Icon -->
    <g transform="translate(50, 10)">
      <path d="M10 60 L35 15 L50 35 L60 22 L75 60 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="58" cy="48" r="4" fill="#dc2626"/>
      <circle cx="68" cy="54" r="3" fill="#dc2626"/>
      <!-- Warning Badge -->
      <circle cx="28" cy="35" r="10" fill="#dc2626"/>
      <text x="28" y="39" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">!</text>
    </g>
    <text x="90" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Historical Landslides</text>
    <text x="90" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#dc2626">(GSI 25k NLSM Catalog)</text>
  </g>


  <!-- ================= DOWNWARD FLOW ARROW ================= -->
  <g transform="translate(600, 315)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4"/>
    <polygon points="-6,45 6,45 0,55" fill="#475569"/>
  </g>


  <!-- ================= BOTTOM ROW: AI PIPELINE & OUTPUTS ================= -->

  <!-- 1. AI Risk Engine -->
  <g transform="translate(180, 400)">
    <!-- AI Brain Icon -->
    <g transform="translate(65, 10)">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
      <path d="M25 22 a8 8 0 0 1 12 -4 a8 8 0 0 1 14 6 a8 8 0 0 1 -4 14 a8 8 0 0 1 4 14 a8 8 0 0 1 -14 6 a8 8 0 0 1 -12 -4 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="35" cy="35" r="3" fill="#7c3aed"/>
      <line x1="35" y1="35" x2="45" y2="30" stroke="#7c3aed" stroke-width="1.5"/>
      <line x1="35" y1="35" x2="42" y2="44" stroke="#7c3aed" stroke-width="1.5"/>
      <circle cx="45" cy="30" r="2.5" fill="#7c3aed"/>
      <circle cx="42" cy="44" r="2.5" fill="#7c3aed"/>
    </g>
    <text x="100" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">AI Risk Engine</text>
    <text x="100" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">(Physics FS + XGBoost LSI)</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(430, 445)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="45,-6 45,6 55,0" fill="#475569"/>
  </g>

  <!-- 2. Smart Route Optimization -->
  <g transform="translate(500, 400)">
    <!-- Winding Road Icon (Green Safe vs Red Hazard) -->
    <g transform="translate(65, 10)">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
      <!-- Red Blocked Path -->
      <path d="M15 55 Q 35 45 45 25 Q 50 15 55 10" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="3 3" stroke-linecap="round"/>
      <!-- Green Safe Bypassing Path -->
      <path d="M15 55 Q 25 35 40 40 Q 55 45 60 15" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
      <!-- Checkmark -->
      <circle cx="58" cy="18" r="7" fill="#10b981"/>
      <path d="M54 18 L57 21 L62 15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="100" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Smart Route Optimization</text>
    <text x="100" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">(Risk-Constrained Green Corridors)</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(750, 445)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="45,-6 45,6 55,0" fill="#475569"/>
  </g>

  <!-- 3. Central Warehouse Resupply & Alerts -->
  <g transform="translate(820, 400)">
    <!-- Central Warehouse & Alert Bell Icon -->
    <g transform="translate(65, 10)">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
      <!-- Bell -->
      <path d="M35 18 C30 18 25 22 25 29 L25 39 L20 44 L50 44 L45 39 L45 29 C45 22 40 18 35 18 Z" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="35" cy="48" r="3.5" fill="#dc2626"/>
      <!-- Radio waves -->
      <path d="M18 28 A12 12 0 0 0 18 40" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <path d="M52 28 A12 12 0 0 1 52 40" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="100" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Real-time Alerts &amp; Dispatch</text>
    <text x="100" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">(Central Warehouse Hub)</text>
  </g>
</svg>
